workflows:
  android-alis:
    name: ALIS PROJECT Android
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Siapkan proyek Android
        script: |
          cd flutter_app
          cp lib/main.dart /tmp/main.dart.bak
          flutter create --platforms=android --org com.alis --project-name alis_project .
          cp /tmp/main.dart.bak lib/main.dart
          python3 tool/patch_android.py
      - name: Ambil dependency
        script: |
          cd flutter_app
          flutter pub get
      - name: Build APK
        script: |
          cd flutter_app
          flutter build apk --release
    artifacts:
      - flutter_app/build/app/outputs/flutter-apk/*.apk
